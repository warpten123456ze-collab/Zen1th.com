<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zen1th</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- GSAP -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#060816;
  --glass:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.08);
  --text:#ffffff;
  --muted:rgba(255,255,255,.62);
  --blue:#7a8cff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:
    radial-gradient(circle at top left,#10172c 0%,transparent 35%),
    radial-gradient(circle at bottom right,#171036 0%,transparent 35%),
    linear-gradient(135deg,#050816,#090b18,#050816);

  color:white;
  overflow:hidden;
  font-family:'Cormorant Garamond',serif;
  height:100vh;
}

/* ===== 背景层 ===== */

.bg-wrapper{
  position:fixed;
  inset:0;
  z-index:-10;
}

.bg-noise{
  position:absolute;
  inset:0;

  opacity:.04;

  background-image:
    radial-gradient(rgba(255,255,255,.15) 1px, transparent 1px);

  background-size:3px 3px;
}

.vignette{
  position:absolute;
  inset:0;

  background:
    radial-gradient(circle at center,
    transparent 20%,
    rgba(0,0,0,.72));
}

.light{
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
  opacity:.22;
  animation:breathe 10s ease-in-out infinite;
}

.light-1{
  width:500px;
  height:500px;
  background:#5f79ff;
  top:-120px;
  left:-120px;
}

.light-2{
  width:700px;
  height:700px;
  background:#6d4dff;
  right:-200px;
  bottom:-200px;
  animation-delay:2s;
}

@keyframes breathe{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.15);
  }
}

/* ===== 页面 ===== */

.page{
  position:relative;
  width:100%;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:60px;
}

/* ===== Skip ===== */

.skip-btn{
  position:fixed;
  top:30px;
  right:30px;

  width:140px;
  height:50px;

  border:none;
  border-radius:999px;

  background:rgba(255,255,255,.06);

  backdrop-filter:blur(16px);

  color:white;

  letter-spacing:1px;

  overflow:hidden;

  cursor:pointer;

  transition:.5s cubic-bezier(.19,1,.22,1);

  z-index:100;
}

.skip-btn::before{
  content:'';

  position:absolute;
  inset:0;

  background:
    radial-gradient(circle,
    rgba(255,255,255,.25),
    transparent 70%);

  opacity:0;

  transition:.5s;
}

.skip-btn:hover{
  transform:translateY(-2px);
  border:1px solid rgba(255,255,255,.18);

  box-shadow:
    0 0 30px rgba(255,255,255,.08),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.skip-btn:hover::before{
  opacity:1;
}

/* ===== Hero ===== */

.hero{
  width:min(1500px,100%);
}

.hero-top{
  margin-bottom:30px;
}

.hero-label{
  font-size:14px;
  letter-spacing:5px;
  color:rgba(255,255,255,.45);
  margin-bottom:20px;
}

.hero-title{
  font-size:clamp(64px,8vw,140px);

  line-height:.92;

  font-weight:700;

  max-width:1200px;

  background:
    linear-gradient(to bottom,
    #ffffff,
    #cdd5ff,
    #7a8cff);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:
    0 10px 50px rgba(255,255,255,.12);

  opacity:0;
}

.hero-desc{
  margin-top:30px;

  max-width:720px;

  font-size:22px;

  line-height:1.8;

  color:rgba(255,255,255,.6);

  opacity:0;
}

/* ===== Cards ===== */

.card-grid{
  margin-top:90px;

  display:grid;

  grid-template-columns:repeat(12,1fr);

  gap:24px;
}

.card{
  position:relative;

  overflow:hidden;

  min-height:180px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  border-radius:40px;

  padding:30px;

  display:flex;
  align-items:flex-end;

  cursor:pointer;

  transition:
    transform .6s cubic-bezier(.19,1,.22,1),
    box-shadow .6s,
    border .6s;

  opacity:0;
}

.card::before{
  content:'';

  position:absolute;
  inset:0;

  background:
    radial-gradient(circle at top left,
    rgba(122,140,255,.22),
    transparent 45%);

  opacity:.8;
}

.card::after{
  content:'';

  position:absolute;

  width:200px;
  height:200px;

  background:
    radial-gradient(circle,
    rgba(255,255,255,.18),
    transparent 70%);

  top:-100px;
  right:-100px;

  transition:.6s;
}

.card:hover{
  transform:
    translateY(-10px)
    rotateX(4deg)
    rotateY(-4deg)
    scale(1.02);

  border:1px solid rgba(255,255,255,.18);

  box-shadow:
    0 25px 80px rgba(0,0,0,.45),
    0 0 40px rgba(122,140,255,.08);
}

.card:hover::after{
  transform:scale(1.4);
}

.card span{
  position:relative;
  z-index:2;

  font-size:32px;
  font-weight:600;

  letter-spacing:1px;
}

.large{
  grid-column:span 5;
}

.medium{
  grid-column:span 4;
}

.wide{
  grid-column:span 7;
}

.tall{
  min-height:260px;
}

/* ===== 转场 ===== */

.transition-overlay{
  position:fixed;
  inset:0;

  background:#050816;

  z-index:999;

  opacity:0;
  pointer-events:none;

  backdrop-filter:blur(0px);
}

/* ===== Ripple ===== */

.ripple{
  position:absolute;

  width:20px;
  height:20px;

  border-radius:50%;

  background:rgba(255,255,255,.25);

  transform:translate(-50%,-50%);

  animation:ripple .9s ease-out forwards;
}

@keyframes ripple{

  0%{
    width:0;
    height:0;
    opacity:.7;
  }

  100%{
    width:1200px;
    height:1200px;
    opacity:0;
  }
}

</style>
</head>

<body>

<div class="bg-wrapper">
  <div class="bg-noise"></div>
  <div class="vignette"></div>
  <div class="light light-1"></div>
  <div class="light light-2"></div>
</div>

<div class="transition-overlay" id="transition"></div>

<button class="skip-btn" id="skipBtn">
  Skip Intro
</button>

<section class="page">

  <div class="hero">

    <div class="hero-top">

      <div class="hero-label">
        REDEFINE YOUR WORLD THROUGH ENGLISH
      </div>

      <h1 class="hero-title" id="title">
        是什么让你来学习英语
      </h1>

      <p class="hero-desc" id="desc">
        用英语重新定义你的视野、野心与未来。
        不是为了应付考试，而是为了拥有更大的世界。
      </p>

    </div>

    <div class="card-grid">

      <div class="card medium" data-path="gaokao">
        <span>高考学习</span>
      </div>

      <div class="card large tall" data-path="cet">
        <span>四六级 · 考研</span>
      </div>

      <div class="card medium" data-path="ielts">
        <span>雅思托福</span>
      </div>

      <div class="card wide" data-path="travel">
        <span>出国 · 留学 · 旅行</span>
      </div>

      <div class="card medium tall" data-path="academic">
        <span>学术专业</span>
      </div>

    </div>

  </div>

</section>

<script>

/* ===== GSAP 入场 ===== */

gsap.to("#title",{
  opacity:1,
  y:0,
  duration:1.6,
  ease:"power4.out"
})

gsap.to("#desc",{
  opacity:1,
  y:0,
  delay:.4,
  duration:1.4,
  ease:"power4.out"
})

gsap.to(".card",{
  opacity:1,
  y:0,
  duration:1.2,
  stagger:.12,
  delay:.6,
  ease:"power4.out"
})

/* ===== 卡片点击 ===== */

const cards=document.querySelectorAll('.card')
const overlay=document.getElementById('transition')

cards.forEach(card=>{

  card.addEventListener('click',(e)=>{

    /* 波纹 */

    const ripple=document.createElement('div')
    ripple.classList.add('ripple')

    ripple.style.left=e.clientX+'px'
    ripple.style.top=e.clientY+'px'

    document.body.appendChild(ripple)

    setTimeout(()=>{
      ripple.remove()
    },900)

    /* 保存方向 */

    const direction=card.dataset.path

    localStorage.setItem('zen1th_direction',direction)

    /* 转场 */

    gsap.to(overlay,{
      opacity:1,
      backdropFilter:'blur(20px)',
      duration:1,
      ease:'power3.inOut'
    })

    gsap.to('body',{
      scale:1.04,
      filter:'blur(10px)',
      duration:1,
      ease:'power3.inOut'
    })

    /* 跳转 */

    setTimeout(()=>{

      window.location.href=
      `home.html?direction=${direction}`

    },1200)

  })

})

/* ===== Skip ===== */

document.getElementById('skipBtn')
.addEventListener('click',()=>{

  gsap.to(overlay,{
    opacity:1,
    duration:.8
  })

  gsap.to('body',{
    scale:1.03,
    filter:'blur(8px)',
    duration:.8
  })

  setTimeout(()=>{
    window.location.href='home.html'
  },900)

})

/* ===== 鼠标景深 ===== */

document.addEventListener('mousemove',(e)=>{

  const x=(window.innerWidth/2-e.clientX)/40
  const y=(window.innerHeight/2-e.clientY)/40

  gsap.to('.hero',{
    x:x,
    y:y,
    duration:1.6,
    ease:'power3.out'
  })

})

</script>

</body>
</html>
