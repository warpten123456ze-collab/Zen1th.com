<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zen1th | Cinematic Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #405cff; }
        body { background-color: #000; color: white; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }

        /* 视频背景容器 */
        .video-bg {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; filter: brightness(0.4) saturate(1.2);
            transition: transform 2s ease-in-out;
        }

        /* 电影感遮罩 */
        .overlay { position: fixed; inset: 0; background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%); z-index: 0; }

        /* 3D 卡片核心样式 */
        .scene { perspective: 1000px; }
        .card-3d {
            position: relative; width: 100%; height: 110px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d; cursor: pointer;
        }
        .card-3d.is-flipped { transform: rotateY(180deg); }
        
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; display: flex;
            align-items: center; justify-content: center;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
        }
        .card-back { transform: rotateY(180deg); background: rgba(64, 92, 255, 0.2); border-color: var(--accent); }

        /* 界面切换动画 */
        .view { transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .hidden-view { opacity: 0; pointer-events: none; transform: scale(1.1) translateY(20px); }

        /* 按钮动效 */
        .btn-glow {
            box-shadow: 0 0 20px rgba(64, 92, 255, 0.3);
            transition: all 0.3s ease;
        }
        .btn-glow:hover { box-shadow: 0 0 40px rgba(64, 92, 255, 0.6); transform: scale(1.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-the-night-sky-animated-121-large.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <section id="view-hero" class="view z-10 flex flex-col items-center justify-center flex-grow text-center w-full px-6">
        <div class="space-y-4">
            <h1 class="text-7xl font-thin tracking-[0.6em] animate-pulse">ZEN1TH</h1>
            <div class="h-[1px] w-24 bg-white/20 mx-auto"></div>
            <p class="text-[10px] tracking-[1.2em] text-blue-400/60 uppercase">The World Awaits</p>
        </div>
        
        <button onclick="switchView('view-levels')" class="btn-glow mt-32 px-14 py-4 rounded-full bg-white text-black text-sm font-light tracking-[0.3em] uppercase transition-all">
            开始同步 / Begin Sync
        </button>

        <div class="mt-40 opacity-30 text-[9px] tracking-[0.4em] font-light italic">
            "至善，一如既往"
        </div>
    </section>

    <section id="view-levels" class="view hidden-view fixed inset-0 z-10 flex flex-col items-center justify-center px-6">
        <h2 class="text-xs font-light tracking-[0.8em] mb-12 text-white/40 uppercase">维度选择 / Dimensions</h2>
        <div class="w-full max-w-sm space-y-4">
            <div onclick="initGame('Origins')" class="group p-8 rounded-3xl border border-white/5 bg-white/5 backdrop-blur-xl hover:bg-white/10 transition-all cursor-pointer">
                <h3 class="text-xl font-light">Origins</h3>
                <p class="text-[9px] text-white/20 tracking-widest mt-1 uppercase">基础意识同步</p>
            </div>
            <div onclick="initGame('Manhattan')" class="group p-8 rounded-3xl border border-white/5 bg-white/5 backdrop-blur-xl hover:bg-white/10 transition-all cursor-pointer">
                <h3 class="text-xl font-light text-blue-400">Manhattan</h3>
                <p class="text-[9px] text-white/20 tracking-widest mt-1 uppercase">钢铁森林的意志</p>
            </div>
        </div>
        <button onclick="switchView('view-hero')" class="mt-12 text-[9px] tracking-widest text-white/20 uppercase hover:text-white/60">← 返回主终端</button>
    </section>

    <section id="view-game" class="view hidden-view fixed inset-0 z-20 flex flex-col items-center p-6 bg-black/80 backdrop-blur-2xl">
        <div class="w-full max-w-md flex justify-between items-end mb-12 mt-10">
            <div class="text-[10px] tracking-widest text-blue-400" id="game-title">SYNCING...</div>
            <div class="text-2xl font-thin"><span id="progress-text">0</span>%</div>
        </div>
        <div id="game-grid" class="grid grid-cols-2 gap-4 w-full max-w-md"></div>
    </section>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();

        function playEtherealSound() {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1200, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.8);
        }

        const database = {
            'Origins': [{ en: 'Zenith', cn: '巅峰' },{ en: 'Ethereal', cn: '空灵' },{ en: 'Void', cn: '虚空' },{ en: 'Soul', cn: '灵魂' }],
            'Manhattan': [{ en: 'Skyline', cn: '天际线' },{ en: 'Pulse', cn: '脉搏' },{ en: 'Steel', cn: '钢铁' },{ en: 'Neon', cn: '霓虹' }]
        };

        function switchView(id) {
            if (ctx.state === 'suspended') ctx.resume();
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden-view'));
            document.getElementById(id).classList.remove('hidden-view');
            // 切换背景视频亮度以增加层次感
            const bg = document.querySelector('.video-bg');
            bg.style.transform = id === 'view-game' ? 'scale(1.1) rotate(2deg)' : 'scale(1) rotate(0deg)';
        }

        function initGame(levelId) {
            const words = database[levelId];
            switchView('view-game');
            document.getElementById('game-title').innerText = levelId.toUpperCase();
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            
            let cards = [];
            words.forEach(w => { cards.push({ text: w.en, id: w.en }); cards.push({ text: w.cn, id: w.en }); });
            cards.sort(() => Math.random() - 0.5);

            cards.forEach(card => {
                const scene = document.createElement('div');
                scene.className = 'scene';
                scene.innerHTML = `
                    <div class="card-3d" data-id="${card.id}">
                        <div class="card-face text-xs font-light px-2 text-center">${card.text}</div>
                        <div class="card-face card-back text-xs">MATCHED</div>
                    </div>
                `;
                const cardEl = scene.querySelector('.card-3d');
                cardEl.onclick = () => handleTap(cardEl, words.length);
                grid.appendChild(scene);
            });
        }

        let selected = [];
        let matches = 0;

        function handleTap(el, total) {
            if (selected.length === 2 || el.classList.contains('is-flipped')) return;
            el.classList.add('is-flipped');
            selected.push(el);

            if (selected.length === 2) {
                if (selected[0].dataset.id === selected[1].dataset.id) {
                    playEtherealSound();
                    matches++;
                    updateProgress(total);
                    selected = [];
                    if (matches === total) setTimeout(() => switchView('view-levels'), 1500);
                } else {
                    setTimeout(() => {
                        selected.forEach(c => c.classList.remove('is-flipped'));
                        selected = [];
                    }, 800);
                }
            }
        }

        function updateProgress(total) {
            document.getElementById('progress-text').innerText = Math.round((matches/total)*100);
        }
    </script>
</body>
</html>
