<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zen1th | Cinematic Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #405cff; }
        body { background-color: #050505; color: white; font-family: -apple-system, sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .card-active { background: rgba(64, 92, 255, 0.15); border-color: var(--accent); box-shadow: 0 0 20px rgba(64, 92, 255, 0.1); transform: scale(1.02); }
        .matched { opacity: 0; transform: scale(0.8); pointer-events: none; transition: all 0.5s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between py-12 px-6">
    <div class="fixed top-[-10%] right-[-10%] w-[80vw] h-[80vw] bg-blue-900/10 rounded-full blur-[120px] pointer-events-none"></div>

    <section id="view-hero" class="z-10 flex flex-col items-center justify-center flex-grow text-center w-full">
        <h1 class="text-6xl font-extralight tracking-[0.4em] mb-4">ZEN1TH</h1>
        <p class="text-[10px] tracking-[0.8em] text-blue-400/40 uppercase mb-24">Unlock Your World</p>
        <button onclick="switchView('view-levels')" class="px-16 py-4 rounded-full bg-white text-black font-medium active:scale-95 transition-all">进入系统</button>
        
        <div class="mt-32 opacity-30 hover:opacity-100 transition-opacity duration-500">
            <p class="text-[10px] tracking-[0.3em] mb-2 uppercase italic">你的回响，是巅峰的基石</p>
            <a href="mailto:wjszzh888@163.com" class="text-[11px] font-light border-b border-white/20 pb-1">wjszzh888@163.com</a>
        </div>
    </section>

    <section id="view-levels" class="hidden z-10 w-full max-w-md pt-10">
        <h2 class="text-xl font-light tracking-widest mb-12 text-center text-white/60 uppercase">同步维度</h2>
        <div class="grid grid-cols-1 gap-4 overflow-y-auto max-h-[60vh] pr-2">
            <div onclick="initGame('Origins')" class="glass p-8 rounded-3xl flex justify-between items-center active:scale-95 transition-all">
                <div><h3 class="text-lg font-medium">Origins</h3><p class="text-xs text-white/30 italic">基础意识同步</p></div>
                <span class="text-blue-500">→</span>
            </div>
            <div onclick="initGame('Manhattan')" class="glass p-8 rounded-3xl flex justify-between items-center active:scale-95 transition-all">
                <div><h3 class="text-lg font-medium">Manhattan</h3><p class="text-xs text-white/30 italic">钢铁森林的意志</p></div>
                <span class="text-blue-500">→</span>
            </div>
            <div onclick="initGame('Queenstown')" class="glass p-8 rounded-3xl flex justify-between items-center active:scale-95 transition-all">
                <div><h3 class="text-lg font-medium">Queenstown</h3><p class="text-xs text-white/30 italic">纯净荒野的召唤</p></div>
                <span class="text-blue-500">→</span>
            </div>
             <div class="glass p-8 rounded-3xl flex justify-between items-center opacity-40">
                <div><h3 class="text-lg font-medium">Silicon Valley</h3><p class="text-xs text-white/30 italic">数字脉冲 (锁定)</p></div>
                <span>🔒</span>
            </div>
        </div>
        <button onclick="switchView('view-hero')" class="mt-12 w-full text-[10px] tracking-widest text-white/20 uppercase">← 返回终端</button>
    </section>

    <section id="view-game" class="hidden z-10 w-full max-w-md">
        <div class="flex justify-between items-center mb-12 px-2">
            <div id="game-title" class="text-xs tracking-widest text-blue-400/60 uppercase">Syncing...</div>
            <div class="text-[10px] text-white/20 uppercase">Sync <span id="progress-text">0</span>%</div>
        </div>
        <div id="game-grid" class="grid grid-cols-2 gap-4"></div>
    </section>

    <script>
        // 扩展词库：你可以随时在这里增加单词
        const database = {
            'Origins': [
                { en: 'Zenith', cn: '顶点/巅峰' },
                { en: 'Ethereal', cn: '优雅空灵的' },
                { en: 'Perspective', cn: '视角/观点' },
                { en: 'Manifesto', cn: '宣言' }
            ],
            'Manhattan': [
                { en: 'Skyscraper', cn: '摩天大楼' },
                { en: 'Metropolis', cn: '大都市' },
                { en: 'Ambition', cn: '野心/抱负' },
                { en: 'Hustle', cn: '忙碌/拼搏' }
            ],
            'Queenstown': [
                { en: 'Wilderness', cn: '荒野/自然' },
                { en: 'Serene', cn: '宁静的' },
                { en: 'Adrenaline', cn: '肾上腺素' },
                { en: 'Landscape', cn: '景观/风景' }
            ]
        };

        let selected = [];
        let matches = 0;

        function switchView(id) {
            ['view-hero', 'view-levels', 'view-game'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function initGame(levelId) {
            const words = database[levelId];
            if (!words) return;
            switchView('view-game');
            document.getElementById('game-title').innerText = `Syncing: ${levelId}`;
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            matches = 0;
            updateProgress(words.length);

            let cards = [];
            words.forEach(w => {
                cards.push({ text: w.en, id: w.en });
                cards.push({ text: w.cn, id: w.en });
            });
            cards.sort(() => Math.random() - 0.5);

            cards.forEach(card => {
                const div = document.createElement('div');
                div.className = 'glass p-6 rounded-2xl text-center text-xs font-light min-h-[100px] flex items-center justify-center transition-all';
                div.innerText = card.text;
                div.dataset.id = card.id;
                div.onclick = () => handleTap(div, words.length);
                grid.appendChild(div);
            });
        }

        function handleTap(el, total) {
            if (selected.length === 2 || el.classList.contains('card-active')) return;
            el.classList.add('card-active');
            selected.push(el);

            if (selected.length === 2) {
                if (selected[0].dataset.id === selected[1].dataset.id) {
                    setTimeout(() => {
                        selected.forEach(c => c.classList.add('matched'));
                        selected = [];
                        matches++;
                        updateProgress(total);
                        if (matches === total) {
                            setTimeout(() => { switchView('view-levels'); }, 800);
                        }
                    }, 400);
                } else {
                    setTimeout(() => {
                        selected.forEach(c => {
                            c.classList.remove('card-active');
                            c.classList.add('shake');
                            setTimeout(() => c.classList.remove('shake'), 300);
                        });
                        selected = [];
                    }, 500);
                }
            }
        }

        function updateProgress(total) {
            const p = Math.round((matches / total) * 100);
            document.getElementById('progress-text').innerText = p;
        }
    </script>
</body>
</html>
