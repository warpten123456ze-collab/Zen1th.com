<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zen1th — Word Match</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<style>

:root{

  --bg:#050816;

  --glass:rgba(255,255,255,.06);

  --line:rgba(255,255,255,.08);

  --blue:#7a8cff;

}

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}

body{

  font-family:'Cormorant Garamond',serif;

  min-height:100vh;

  overflow:hidden;

  color:white;

  background:

    radial-gradient(circle at top left,#10172b 0%,transparent 30%),

    radial-gradient(circle at bottom right,#181135 0%,transparent 30%),

    linear-gradient(135deg,#040611,#060816,#040611);

}

/* BG */

.bg-glow{

  position:fixed;

  inset:0;

  z-index:-2;

  background:

    radial-gradient(circle at center,

    rgba(122,140,255,.08),

    transparent 60%);

  animation:breathe 8s ease-in-out infinite;

}

@keyframes breathe{

  0%{

    transform:scale(1);

    opacity:.5;

  }

  50%{

    transform:scale(1.1);

    opacity:1;

  }

  100%{

    transform:scale(1);

    opacity:.5;

  }

}

/* Layout */

.wrapper{

  width:100%;

  min-height:100vh;

  padding:50px;

  display:flex;

  flex-direction:column;

}

/* Top */

.topbar{

  width:100%;

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:40px;

}

.logo{

  font-size:42px;

  font-weight:700;

  background:

    linear-gradient(to bottom,#fff,#7a8cff);

  -webkit-background-clip:text;

  -webkit-text-fill-color:transparent;

}

.round{

  font-size:20px;

  color:rgba(255,255,255,.5);

}

/* Main */

.game-board{

  flex:1;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:40px;

}

/* Column */

.column{

  display:flex;

  flex-direction:column;

  gap:24px;

}

/* Card */

.word-card{

  position:relative;

  overflow:hidden;

  padding:28px;

  min-height:110px;

  border-radius:30px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  display:flex;

  align-items:center;

  font-size:30px;

  cursor:pointer;

  transition:

    transform .5s,

    border .5s,

    box-shadow .5s;

}

.word-card::before{

  content:'';

  position:absolute;

  inset:0;

  background:

    radial-gradient(circle at top left,

    rgba(122,140,255,.12),

    transparent 40%);

}

.word-card:hover{

  transform:

    translateY(-6px)

    scale(1.01);

  border-color:rgba(255,255,255,.16);

  box-shadow:

    0 20px 50px rgba(0,0,0,.35);

}

/* Selected */

.word-card.selected{

  border-color:#7a8cff;

  box-shadow:

    0 0 30px rgba(122,140,255,.2);

}

/* Correct */

.word-card.correct{

  border-color:#54ff9f;

  background:

    rgba(84,255,159,.08);

}

/* Wrong */

.word-card.wrong{

  border-color:#ff5f7a;

  background:

    rgba(255,95,122,.08);

}

/* Ripple */

.ripple{

  position:absolute;

  border-radius:999px;

  background:rgba(255,255,255,.2);

  transform:scale(0);

  animation:ripple .7s ease-out;

}

@keyframes ripple{

  to{

    transform:scale(12);

    opacity:0;

  }

}

/* Bottom */

.bottom{

  margin-top:40px;

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.score{

  color:rgba(255,255,255,.55);

  font-size:22px;

}

.next-btn{

  width:200px;

  height:60px;

  border:none;

  border-radius:999px;

  background:

    linear-gradient(135deg,#8ca0ff,#6279ff);

  color:white;

  font-size:18px;

  cursor:pointer;

  transition:.5s;

}

.next-btn:hover{

  transform:

    translateY(-3px);

  box-shadow:

    0 20px 50px rgba(98,121,255,.4);

}

/* Result */

.result-screen{

  position:fixed;

  inset:0;

  background:

    rgba(5,8,22,.88);

  backdrop-filter:blur(20px);

  display:none;

  justify-content:center;

  align-items:center;

  z-index:100;

}

.result-card{

  width:700px;

  padding:60px;

  border-radius:40px;

  background:rgba(255,255,255,.06);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(20px);

  text-align:center;

}

.result-title{

  font-size:70px;

}

.result-data{

  margin-top:30px;

  display:flex;

  justify-content:space-around;

}

.result-item h3{

  font-size:60px;

}

.result-item p{

  color:rgba(255,255,255,.5);

}

</style>

</head>

<body>

<div class="bg-glow"></div>

<div class="wrapper">

  <div class="topbar">

    <div class="logo">

      Zen1th

    </div>

    <div class="round" id="roundText">

      ROUND 1 / 4

    </div>

  </div>

  <div class="game-board">

    <div class="column" id="englishColumn"></div>

    <div class="column" id="chineseColumn"></div>

  </div>

  <div class="bottom">

    <div class="score" id="scoreText">

      CORRECT : 0

    </div>

    <button class="next-btn" id="nextBtn">

      NEXT ROUND

    </button>

  </div>

</div>

<!-- Result -->

<div class="result-screen" id="resultScreen">

  <div class="result-card">

    <div class="result-title">

      Session Complete

    </div>

    <div class="result-data">

      <div class="result-item">

        <h3 id="accuracy">0%</h3>

        <p>Accuracy</p>

      </div>

      <div class="result-item">

        <h3 id="usedTime">0s</h3>

        <p>Time</p>

      </div>

      <div class="result-item">

        <h3 id="learnedWords">0</h3>

        <p>Learned</p>

      </div>

    </div>

  </div>

</div>

<script>

/* ========================= */

/* WORDS */

/* ========================= */

const words=[

  {word:'abandon',meaning:'放弃'},

  {word:'achieve',meaning:'实现'},

  {word:'analyze',meaning:'分析'},

  {word:'concept',meaning:'概念'},

  {word:'maintain',meaning:'维持'},

  {word:'approach',meaning:'方法'},

  {word:'derive',meaning:'获得'},

  {word:'significant',meaning:'重要的'},

  {word:'theory',meaning:'理论'},

  {word:'transfer',meaning:'转移'},

  {word:'expand',meaning:'扩展'},

  {word:'respond',meaning:'回应'},

  {word:'complex',meaning:'复杂的'},

  {word:'potential',meaning:'潜力'},

  {word:'strategy',meaning:'策略'},

  {word:'ultimate',meaning:'最终的'},

  {word:'vision',meaning:'视野'},

  {word:'explore',meaning:'探索'},

  {word:'construct',meaning:'构建'},

  {word:'motivate',meaning:'激励'}

]

/* ========================= */

/* STATE */

/* ========================= */

let round=1

let totalCorrect=0

let totalAnswered=0

let selectedEnglish=null

let selectedChinese=null

let currentPairs=[]

const startTime=Date.now()

/* ========================= */

/* ELEMENTS */

/* ========================= */

const englishColumn=

document.getElementById('englishColumn')

const chineseColumn=

document.getElementById('chineseColumn')

const scoreText=

document.getElementById('scoreText')

const roundText=

document.getElementById('roundText')

const resultScreen=

document.getElementById('resultScreen')

/* ========================= */

/* RANDOM */

/* ========================= */

function shuffle(arr){

  return arr.sort(()=>Math.random()-0.5)

}

/* ========================= */

/* LOAD ROUND */

/* ========================= */

function loadRound(){

  englishColumn.innerHTML=''

  chineseColumn.innerHTML=''

  selectedEnglish=null

  selectedChinese=null

  currentPairs=

    shuffle([...words])

    .slice((round-1)*5,round*5)

  const shuffledChinese=

    shuffle([...currentPairs])

  currentPairs.forEach(item=>{

    const card=

      createCard(item.word,'english')

    card.dataset.match=item.meaning

    englishColumn.appendChild(card)

  })

  shuffledChinese.forEach(item=>{

    const card=

      createCard(item.meaning,'chinese')

    card.dataset.match=item.word

    chineseColumn.appendChild(card)

  })

  roundText.innerText=

  `ROUND ${round} / 4`

}

/* ========================= */

/* CREATE CARD */

/* ========================= */

function createCard(text,type){

  const card=document.createElement('div')

  card.className='word-card'

  card.innerText=text

  card.dataset.type=type

  card.addEventListener('click',(e)=>{

    rippleEffect(e,card)

    selectCard(card)

  })

  return card

}

/* ========================= */

/* RIPPLE */

/* ========================= */

function rippleEffect(e,card){

  const ripple=

    document.createElement('span')

  ripple.className='ripple'

  ripple.style.left=

    e.offsetX+'px'

  ripple.style.top=

    e.offsetY+'px'

  ripple.style.width='20px'

  ripple.style.height='20px'

  card.appendChild(ripple)

  setTimeout(()=>{

    ripple.remove()

  },700)

}

/* ========================= */

/* SELECT */

/* ========================= */

function selectCard(card){

  card.classList.add('selected')

  if(card.dataset.type==='english'){

    if(selectedEnglish)

      selectedEnglish.classList.remove('selected')

    selectedEnglish=card

  }else{

    if(selectedChinese)

      selectedChinese.classList.remove('selected')

    selectedChinese=card

  }

  if(selectedEnglish && selectedChinese){

    checkMatch()

  }

}

/* ========================= */

/* CHECK */

/* ========================= */

function checkMatch(){

  totalAnswered++

  const english=

    selectedEnglish.innerText

  const chinese=

    selectedChinese.innerText

  const pair=

    currentPairs.find(

      item=>item.word===english

    )

  if(pair.meaning===chinese){

    totalCorrect++

    selectedEnglish.classList.add('correct')

    selectedChinese.classList.add('correct')

    saveLearnedWord()

  }else{

    selectedEnglish.classList.add('wrong')

    selectedChinese.classList.add('wrong')

    saveWrongWord(pair)

  }

  scoreText.innerText=

  `CORRECT : ${totalCorrect}`

  setTimeout(()=>{

    selectedEnglish.remove()

    selectedChinese.remove()

    selectedEnglish=null

    selectedChinese=null

  },500)

}

/* ========================= */

/* STORAGE */

/* ========================= */

function saveLearnedWord(){

  let count=

    JSON.parse(

      localStorage.getItem(

        'zen1th_learned'

      )

    ) || 0

  count++

  localStorage.setItem(

    'zen1th_learned',

    JSON.stringify(count)

  )

}

function saveWrongWord(word){

  let wrong=

    JSON.parse(

      localStorage.getItem(

        'zen1th_wrongbook'

      )

    ) || []

  wrong.push(word)

  localStorage.setItem(

    'zen1th_wrongbook',

    JSON.stringify(wrong)

  )

}

/* ========================= */

/* NEXT */

/* ========================= */

document.getElementById('nextBtn')

.addEventListener('click',()=>{

  if(round<4){

    round++

    gsap.fromTo('.game-board',

      {

        opacity:0,

        y:30

      },

      {

        opacity:1,

        y:0,

        duration:1

      }

    )

    loadRound()

  }else{

    showResult()

  }

})

/* ========================= */

/* RESULT */

/* ========================= */

function showResult(){

  const accuracy=

    Math.floor(

      totalCorrect/

      totalAnswered*100

    )

  const used=

    Math.floor(

      (Date.now()-startTime)/1000

    )

  document.getElementById('accuracy')

  .innerText=accuracy+'%'

  document.getElementById('usedTime')

  .innerText=used+'s'

  document.getElementById('learnedWords')

  .innerText=totalCorrect

  resultScreen.style.display='flex'

  gsap.from('.result-card',{

    scale:.8,

    opacity:0,

    duration:1,

    ease:'power4.out'

  })

}

/* ========================= */

/* INIT */

/* ========================= */

loadRound()

gsap.from('.word-card',{

  opacity:0,

  y:30,

  stagger:.08,

  duration:1,

  ease:'power4.out'

})

</script>

</body>

</html>
